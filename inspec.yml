name: microsoft-windows-11-stig-baseline
title: "Microsoft Windows 11 Security Technical Implementation Guide :: Version 2, Release 11 :: Benchmark Date: 30 September 2026"
maintainer: MITRE SAF Team
copyright: MITRE
copyright_email: saf@groups.mitre.org
license: Apache-2.0
summary: InSpec profile aligned to STIG Guidance for Microsoft Windows 11 Security Technical Implementation Guide
version: 0.1.0
inspec_version: ">=5.22.80"
supports:
- platform-family: windows

inputs:
  # SV-253264
  - name: av_approved_software
    desc: "This is a list of Approved Anti-Virus Software"
    type: Array
    value:
      - Windows Defender
      - McAfee Host Intrusion Prevention
      - McAfee Endpoint Security
      - McAfee Agent
      - Trellix Endpoint Security

  # SV-253264
  - name: av_active_product_states
    desc: "Windows Security Center (root\\SecurityCenter2 AntiVirusProduct) productState values that indicate an active antivirus, per the STIG check [397568 = active and up to date, 397584 = active but out of date]"
    type: Array
    value:
      - 397568
      - 397584

  # SV-253259, SV-253260, SV-253261
  - name: avd_no_data_at_rest
    desc: "Set to true if the system is an Azure Virtual Desktop (AVD) implementation with no data at rest [false]"
    type: String
    value: "false"

  # SV-253260
  - name: bitlocker_network_unlock
    desc: "Set to true if BitLocker network unlock is used, which permits UseTPMPIN/UseTPMKeyPIN values of 2 [false]"
    type: String
    value: "false"

  # SV-253261
  - name: bitlocker_pin_len
    desc: "The minimum length for the BitLocker Pin [6]"
    type: Numeric
    value: 6

  # SV-253263
  - name: windows_11_end_of_servicing
    desc: "End of updates date (YYYY-MM-DD) for each Windows 11 OS build by servicing option, from https://learn.microsoft.com/en-us/windows/release-health/windows11-release-information. Builds not listed are no longer serviced; ~ means updates have already ended for that servicing option."
    type: Hash
    value:
      # 26H2
      "26300":
        home_pro: "2028-10-10"
        enterprise: "2029-10-09"
      # 26H1
      "28000":
        home_pro: "2028-03-14"
        enterprise: "2029-03-13"
      # 25H2
      "26200":
        home_pro: "2027-10-12"
        enterprise: "2028-10-10"
      # 24H2 (Enterprise LTSC 2024 / IoT Enterprise LTSC 2024)
      "26100":
        home_pro: ~
        enterprise: "2027-10-12"
        ltsc: "2029-10-09"
        iot_ltsc: "2034-10-10"
      # 23H2
      "22631":
        home_pro: ~
        enterprise: "2026-11-10"

  # SV-253302
  - name: min_pass_age
    desc: "Sets the minimum age for a password [1]"
    type: Numeric
    value: 1

  # SV-253303
  - name: min_pass_len
    desc: "Sets the minimum length of passwords [14]"
    type: Numeric
    value: 14

  # SV-253304
  - name: enable_pass_complexity
    desc: "If windows should enforce password complexity (0/1) [1]"
    type: Numeric
    value: 1

  # SV-253301
  - name: max_pass_age
    desc: "Sets the maximum age for a password [180]"
    type: Numeric
    value: 180

  # SV-253476
  - name: local_admin_pass_age
    desc: "Maximum age in days for the local Administrator account password and the Windows LAPS PasswordAgeDays setting [180]"
    type: Numeric
    value: 180

  # SV-253297, SV-253299
  - name: pass_lock_time
    desc: "Sets the number of min before a session is locked out [15]"
    type: Numeric
    value: 15

  # SV-253300
  - name: pass_hist_size
    desc: "Number of passwords remembered in the password history [24]"
    type: Numeric
    value: 24

  # SV-253298
  - name: max_pass_lockout
    desc: "Account lockout threshold is recommended to be 3 or less invalid logon attempts [3]"
    type: Numeric
    value: 3

  # SV-288812
  - name: max_inactive_days
    desc: "Max number of days an account is allowed to be inactive [35]"
    type: Numeric
    value: 35

  # SV-253262, SV-253395, SV-253427, SV-253428, SV-253429, SV-253430
  - name: sensitive_system
    description: "Set flag to true if the target system is sensitive"
    type: String
    value: "false"

  # SV-253270
  - name: backup_operators
    type: Array
    description: "List of authorized users in the local Backup Operators Group"
    value: []

  # SV-253269
  - name: administrators
    type: Array
    description: "List of authorized users in the local Administrators group"
    sensitive: true
    value: []

  # SV-253271
  - name: hyper_v_admin
    type: Array
    description: "List of authorized users in the Hyper-V Group"
    sensitive: true
    value: []
  
  # SV-253445
  - name: LegalNoticeText
    type: String
    value:
     "You are accessing a U.S. Government (USG) Information System (IS) that is
      provided for USG-authorized use only.
      By using this IS (which includes any device attached to this IS), you consent
      to the following conditions:
      -The USG routinely intercepts and monitors communications on this IS for
      purposes including, but not limited to, penetration testing, COMSEC monitoring,
      network operations and defense, personnel misconduct (PM), law enforcement
      (LE), and counterintelligence (CI) investigations.
      -At any time, the USG may inspect and seize data stored on this IS.
      -Communications using, or data stored on, this IS are not private, are subject
      to routine monitoring, interception, and search, and may be disclosed or used
      for any USG-authorized purpose.
      -This IS includes security measures (e.g., authentication and access controls)
      to protect USG interests--not for your personal benefit or privacy.
      -Notwithstanding the above, using this IS does not constitute consent to PM, LE
      or CI investigative searching or monitoring of the content of privileged
      communications, or work product, related to personal representation or services
      by attorneys, psychotherapists, or clergy, and their assistants. Such
      communications and work product are private and confidential. See User
      Agreement for details."

  # SV-253427
  - name: dod_root_ca_cns
    desc: "Common Names of the DoW Root CA certificates that must be installed and unexpired in the Trusted Root Certification Authorities store"
    type: Array
    value:
      - DoD Root CA 3
      - DoD Root CA 5
      - DoD Root CA 6

  # SV-253415
  - name: transcript_privileged_sids
    desc: "SIDs permitted read/modify access to the PowerShell Transcript output directory [SYSTEM, Administrators]"
    type: Array
    value:
      - S-1-5-18
      - S-1-5-32-544
  # SV-253431
  - name: reg_software_perms
    desc: "The required Registry Software Permission Settings"
    type: Array
    value:
      - CREATOR OWNER Allow  FullControl
      - NT AUTHORITY\SYSTEM Allow  FullControl
      - BUILTIN\Administrators Allow  FullControl
      - BUILTIN\Users Allow  ReadKey
      - APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES Allow  ReadKey
      - S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681 Allow  ReadKey
  
  # SV-253431
  - name: reg_security_perms
    desc: "The required Registry Security Permissions Settings"
    type: Array
    value:
      - NT AUTHORITY\SYSTEM Allow  FullControl
      - BUILTIN\Administrators Allow  ReadKey, ChangePermissions
  
  # V-253431
  - name: reg_system_perms
    desc: "The required Registry System Permissions Settings"
    type: Array
    value:
      - CREATOR OWNER Allow  FullControl
      - NT AUTHORITY\SYSTEM Allow  FullControl
      - BUILTIN\Administrators Allow  FullControl
      - BUILTIN\Users Allow  ReadKey
      - APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES Allow  ReadKey
      - S-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681 Allow  ReadKey
    
  # SV-253274
  - name: c_folder_permissions
    desc: "Default Permissions for C:\\ Folder on OS"
    type: Array
    value:
      - S-1-15-3-65536-1888954469-739942743-1668119174-2468466756-4239452838-1296943325-355587736-700089176:(S,RD,X,RA)
      - NT AUTHORITY\Authenticated Users:(S,AD)
      - NT AUTHORITY\Authenticated Users:(OI)(CI)(IO)(M)
      - NT AUTHORITY\SYSTEM:(OI)(CI)(F)
      - BUILTIN\Administrators:(OI)(CI)(F)
      - BUILTIN\Users:(OI)(CI)(RX)
      - Mandatory Label\High Mandatory Level:(OI)(NP)(IO)(NW)
  
  # SV-253274
  - name: c_windows_folder_permissions
    desc: "Default Permissions for C:\\Windows Folder on OS"
    type: Array
    value:
      - NT SERVICE\TrustedInstaller:(F)
      - NT SERVICE\TrustedInstaller:(CI)(IO)(F)
      - NT AUTHORITY\SYSTEM:(M)
      - NT AUTHORITY\SYSTEM:(OI)(CI)(IO)(F)
      - BUILTIN\Administrators:(M)
      - BUILTIN\Administrators:(OI)(CI)(IO)(F)
      - BUILTIN\Users:(RX)
      - BUILTIN\Users:(OI)(CI)(IO)(GR,GE)
      - CREATOR OWNER:(OI)(CI)(IO)(F)
      - APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(RX)
      - APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)
      - APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(RX)
      - APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)
  
  # SV-253274
  - name: c_program_files_folder_permissions
    desc: "Default Permissions for C:\\Windows Folder on OS"
    type: Array
    value:
      - NT SERVICE\TrustedInstaller:(F)
      - NT SERVICE\TrustedInstaller:(CI)(IO)(F)
      - NT AUTHORITY\SYSTEM:(M)
      - NT AUTHORITY\SYSTEM:(OI)(CI)(IO)(F)
      - BUILTIN\Administrators:(M)
      - BUILTIN\Administrators:(OI)(CI)(IO)(F)
      - BUILTIN\Users:(RX)
      - BUILTIN\Users:(OI)(CI)(IO)(GR,GE)
      - CREATOR OWNER:(OI)(CI)(IO)(F)
      - APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(RX)
      - APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)
      - APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(RX)
      - APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)

  # SV-253291
  - name: bluetooth_approved
    desc: "If Bluetooth is approved for use on the system true=1 false=0 [false]"
    type: Numeric
    value: 0

  #SV-253351
  - name: camera_approved
    desc: "If Camera use is approved for the system 'Deny' or 'Allow' [Deny]"
    type: String
    value: "Deny"

  #SV-253338
  - name: max_security_event_log_size
    desc: "The minimum size for the Security Event Log in KB [5120000]"
    type: Numeric
    value: 5120000


  - name: vdi_services
    desc: "List of services that indicate it is a VDI workstation."
    type: Array
    value:
      - "BrokerAgent" #Citrix Virtual Apps and Desktops Service
      - "TermService" #Microsoft Remote Desktop Services
      - "WSNM" #VMware Horizon View Agent
      - "VMBlast" #VMware Horizon View Agent
      - "RDAgentBootLoader" #Microsoft Azure Remote Desktop Services Agent Boot Loader
      - "SkyLightWorkspaceConfigService" #AWS Windows WorkSpaces Service

  - name: is_vdi
    desc: "Flag to indicate if the system is a VDI workstation"
    type: String
    value: "false"